name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; skip runs queued between the run
# in-progress and the latest queued.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build static site
        env:
          # CI=false so CRA warnings are not treated as fatal errors.
          CI: "false"
          # PUBLIC_URL matches package.json `homepage` and the GitHub Pages
          # project sub-path (https://<user>.github.io/14-meridian-akupunktur/).
          PUBLIC_URL: /Meridian
          # A harmless placeholder for the baked-in REACT_APP_BACKEND_URL —
          # the deployed static site never calls the backend (audio uses the
          # browser Web Speech API, data is bundled).
          REACT_APP_BACKEND_URL: https://14-meridian-akupunktur.static
        run: yarn build

      - name: Ensure .nojekyll is present in the build output
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
